name: Test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, like Validate, so a broken runner image or action shows up
    # even in weeks with no pushes. Dependencies come from uv.lock, so this
    # tests the locked Home Assistant, not the newest release.
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check custom_components tests

      - name: Test
        run: uv run pytest -q
